lang: ru-RU

format:
  revealjs:
    theme: [black, ../../shared/styles/neutrinohit-reveal.scss]
    logo: ../../shared/reveal/dvnlogo.png
    width: 1600
    height: 900
    margin: 0.03
    slide-number: true
    slide-level: 2
    chalkboard: true
    preview-links: auto
    transition: none
    background-transition: none
    center: false
    incremental: false
    toc: true
    toc-depth: 1
    toc-title: "План лекции"
    code-line-numbers: false
    code-copy: true
    include-after-body:
      - text: |
          <script data-external="1" data-context-home="https://neutrinohit.github.io/ru/courses/gravity.html" data-context-home-label="Страница курса" src="../../shared/reveal/neutrinohit-reveal-footer.js"></script>
      - ../../analytics/cloudflare-web-analytics.html

execute:
  echo: false
  warning: false
  message: false
